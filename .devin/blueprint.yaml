# https://docs.devin.ai/onboard-devin/environment-yaml
# One-time setup (e.g., install system tools, global CLIs).
initialize: |
  export ANDROID_HOME="$HOME/android-sdk"
  if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
    mkdir -p "$ANDROID_HOME/cmdline-tools"
    curl -fsSLo /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
    mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
    rm -f /tmp/cmdtools.zip
  fi
  yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
  "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64" > /dev/null
  echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n learnsort -k "system-images;android-35;google_apis;x86_64" -d pixel_6 --force > /dev/null
  mkdir -p "$HOME/.gradle/init.d"
  cat > "$HOME/.gradle/init.d/maven-central-mirror.gradle" <<'GRADLE'
  def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
  beforeSettings { settings ->
      settings.pluginManagement.repositories { maven { url mirror } }
      settings.dependencyResolutionManagement.repositories { maven { url mirror } }
  }
  GRADLE
  echo "ANDROID_HOME=$ANDROID_HOME" >> "$ENVRC"
  echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$ENVRC"
  echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH" >> "$ENVRC"

# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  echo "sdk.dir=$ANDROID_HOME" > local.properties
  chmod +x gradlew
  ./gradlew --no-daemon -q :app:dependencies > /dev/null

knowledge:
  - name: build
    contents: |
      ./gradlew assembleDebug assembleRelease --no-daemon   # APKs in app/build/outputs/apk/{debug,release}/
  - name: lint
    contents: |
      ./gradlew lint --no-daemon
  - name: test
    contents: |
      No unit/instrumented tests exist yet. Smoke test: start emulator, then
      adb install -r app/build/outputs/apk/debug/app-debug.apk && adb shell am start -n com.learnsort.app/.MainActivity
  - name: startup
    contents: |
      nohup emulator -avd learnsort -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect > /tmp/emu.log 2>&1 &
      adb wait-for-device && until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do sleep 3; done
